<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoVault</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <a href="index.html" class="logo">AutoVault</a>
  <div>
    <a href="browse.html">Browse</a>
    <a href="post.html">Post a listing</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>
<main>
  <div id="content"><p>Loading...</p></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="js/common.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('id');

  async function init() {
    try {
      const c = await api('/api/listings/' + id);
      const reviews = await api('/api/dealers/' + c.dealer_id + '/reviews');
      const photo = esc((c.photos[0] && c.photos[0].url) || 'https://placehold.co/800x500/16161a/d90429?text=No+photo');
      document.title = c.title + ' | AutoVault';
      document.getElementById('content').innerHTML = `
        <h1>${esc(c.title)}</h1>
        <div class="detail">
          <div>
            <img src="${photo}" alt="${esc(c.title)}">
            <div class="panel">
              <p class="price">${money(c.price)}</p>
              <p>${c.year} · ${esc(c.fuel_type)} · ${esc(c.transmission)} · ${Number(c.mileage).toLocaleString()} km</p>
              <p style="margin-top:10px">${esc(c.description || '')}</p>
              <div style="margin-top:10px">${c.features.map((f) => `<span class="tag">${esc(f)}</span>`).join('')}</div>
            </div>
                        <div class="panel" id="auction" style="display:none"></div>
            <div class="panel">
              <h3>Dealer reviews</h3>
              ${reviews.map((r) => `<div class="review">
                <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                <strong> ${esc(r.reviewer_name)}</strong>
                <p>${esc(r.comment || '')}</p></div>`).join('') || '<p>No reviews yet.</p>'}
            </div>
          </div>
          <div>
            <div class="panel">
              <h3>${esc(c.dealer_name)}</h3>
              <p>${esc(c.dealer_location || '')}</p>
              <p>${esc(c.dealer_phone || '')}</p>
            </div>
            <div class="panel">
              <h3>Send an inquiry</h3>
              <form id="inq">
                <input name="name" placeholder="Your name" required>
                <input name="email" type="email" placeholder="Email" required>
                <input name="phone" placeholder="Phone (optional)">
                <textarea name="message" rows="4" placeholder="I'm interested in this car..." required></textarea>
                <button class="btn" type="submit">Send inquiry</button>
              </form>
            </div>
          </div>
        </div>`;

      document.getElementById('inq').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target));
        body.listing_id = Number(id);
        try {
          await api('/api/inquiries', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          toast('Inquiry sent!');
          e.target.reset();
        } catch (err) { toast(err.message, false); }
      });
    } catch (e) {
      document.getElementById('content').innerHTML = '<p>Listing not found.</p>';
      toast(e.message, false);
    }
  }
    async function initAuction() {
    const box = document.getElementById('auction');
    if (!box) return;
    let a;
    try { a = await api('/api/auctions/by-listing/' + id); } catch (e) { return; }
    box.style.display = 'block';
    let secondsLeft = a.seconds_left;

    box.innerHTML = `
      <h3>Live auction</h3>
      <p>Current bid</p>
      <p class="price" id="a-high"></p>
      <p>Time left: <strong id="a-time"></strong></p>
      <form id="bid">
        <input name="bidder_name" placeholder="Your name" required>
        <input name="amount" type="number" placeholder="Your bid (GH₵)" required>
        <button class="btn" type="submit">Place bid</button>
      </form>
      <div id="a-bids" style="margin-top:10px"></div>`;

    function render(s) {
      secondsLeft = s.seconds_left;
      document.getElementById('a-high').textContent =
        s.highest === null ? 'No bids yet. Starts at ' + money(s.starting_price) : money(s.highest);
      document.getElementById('a-bids').innerHTML = s.bids.map((b) =>
        `<div class="review"><strong>${esc(b.bidder_name)}</strong> ${money(b.amount)}</div>`).join('');
    }

    function tick() {
      const el = document.getElementById('a-time');
      if (!el) return;
      if (secondsLeft <= 0) {
        el.textContent = 'Ended';
        document.querySelector('#bid button').disabled = true;
        return;
      }
      const d = Math.floor(secondsLeft / 86400);
      const h = Math.floor((secondsLeft % 86400) / 3600);
      const m = Math.floor((secondsLeft % 3600) / 60);
      const s = secondsLeft % 60;
      el.textContent = `${d}d ${h}h ${m}m ${s}s`;
      secondsLeft--;
    }

    render(a);
    tick();
    setInterval(tick, 1000);

    const socket = io();
    socket.emit('join', a.id);
    socket.on('auction-update', render);

    document.getElementById('bid').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      try {
        await api('/api/auctions/' + a.id + '/bids', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        toast('Bid placed!');
        e.target.amount.value = '';
      } catch (err) { toast(err.message, false); }
    });
  }

  init().then(initAuction);
</script>
</body></html>
