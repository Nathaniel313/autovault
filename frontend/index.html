<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoVault</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <a href="index.html" class="logo">AutoVault</a>
  <div>
    <a href="browse.html">Browse</a>
    <a href="post.html">Post a listing</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>
<section class="hero">
  <h1>Find your next ride</h1>
  <p>Browse trusted dealers across Ghana.</p>
  <a class="btn" href="browse.html">Browse cars</a>
</section>
<main>
  <h2>Latest listings</h2>
  <div class="grid" id="grid"></div>
</main>
<script src="js/common.js"></script>
<script>
  api('/api/listings?limit=3')
    .then((cars) => { document.getElementById('grid').innerHTML = cars.map(carCard).join(''); })
    .catch((e) => toast(e.message, false));
</script>
</body></html>
